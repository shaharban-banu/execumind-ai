name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify ingestion models
        run: |
          echo "Commit:"
          git rev-parse HEAD
          echo "Ingestion models:"
          find ingestion/models -maxdepth 2 -type f -print

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Verify Docker build context
        run: |
          echo "Checking ingestion models before Docker build:"
          find ingestion/models -maxdepth 2 -type f -print

          echo "Dockerfile COPY instructions:"
          grep -n "COPY" Dockerfile
      - name: Build image
        run: |
          docker build -t shaharban123/execumind-backend:latest .

      - name: Verify Docker image contents
        run: |
          docker run --rm shaharban123/execumind-backend:latest \
            ls -la /app/ingestion/models

      - name: Push image
        run: |
          docker push shaharban123/execumind-backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/execumind
            sudo docker compose pull backend
            sudo docker compose up -d --force-recreate backend
            sudo docker image prune -a -f