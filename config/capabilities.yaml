version: 1.0

capabilities:

  analytics:

    description: Business KPI analysis using structured data

    required_tables:
      - customers
      - orders
      - order_items
      - payments

  forecasting:

    description: Revenue, Orders, Customer Growth and AOV forecasting

    required_tables:
      - orders
      - payments

  customer_intelligence:

    description: Customer satisfaction analysis

    required_tables:
      - customers

    optional_tables:
      - reviews

    optional_documents:
      - business_documents

  product_intelligence:

    description: Product and category performance analysis

    required_tables:
      - products
      - order_items

  seller_intelligence:

    description: Seller performance analysis

    optional_tables:
      - sellers

  executive_intelligence:

    description: Final executive decision support

    depends_on:
      - analytics
      - forecasting
      - customer_intelligence